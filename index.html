  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillverse Game</title>
    <!-- Skillverse loader: warm the biggest artwork layers -->
    <link rel="preload" as="image" type="image/webp" href="/assets/skillverse/layers/planet.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/skillverse/layers/word.webp" />

      html,body{margin:0;background:#f4f8ff}
      #svlg-boot{position:fixed;inset:0;z-index:99998;
        background:radial-gradient(circle at 50% 42%,#ffffff 0%,#f4f8ff 55%,#e7f0fb 100%)}
    </style>
  </head>
  <body>
    <div id="svlg-boot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
